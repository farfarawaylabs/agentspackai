name: Release CLI

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-agents-pack
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate repository
        run: bun run check

      - name: Validate CLI release metadata
        run: >-
          bun run cli:build
          --validate-only
          --registry registry/v1/cli.json
          --tag "$GITHUB_REF_NAME"

  build:
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # macOS targets build on their own architecture so they can be
        # re-signed with Apple's codesign and executed before release.
        include:
          - target: darwin-arm64
            runner: macos-latest
            smoke-test: true
          - target: darwin-x64
            runner: macos-26-intel
            smoke-test: true
          - target: linux-arm64
            runner: ubuntu-latest
            smoke-test: false
          - target: linux-x64
            runner: ubuntu-latest
            smoke-test: true
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read CLI version
        id: version
        run: echo "value=$(bun -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Compile standalone executable
        run: >-
          bun run cli:build
          --target "${{ matrix.target }}"
          --output dist/binary/agents-pack
          --registry registry/v1/cli.json
          --tag "$GITHUB_REF_NAME"

      # bun build --compile appends the bundle after the runtime is signed and
      # does not reliably re-sign it: darwin-x64 keeps Bun's broken Developer ID
      # signature, and Bun before 1.4.1 mis-hashed the last darwin-arm64 page.
      # macOS 27 kills either on launch, so every macOS executable gets a fresh
      # ad-hoc signature and must pass strict verification.
      - name: Re-sign and verify macOS executable
        if: startsWith(matrix.target, 'darwin-')
        run: |
          codesign --force --sign - dist/binary/agents-pack
          codesign --verify --strict --verbose=2 dist/binary/agents-pack

      - name: Smoke-test executable
        if: matrix.smoke-test
        run: |
          test "$(dist/binary/agents-pack --version)" = \
            "agents-pack ${{ steps.version.outputs.value }}"
          dist/binary/agents-pack --help

      - name: Package executable and checksum
        env:
          ASSET: agents-pack-${{ steps.version.outputs.value }}-${{ matrix.target }}.tar.gz
          COPYFILE_DISABLE: "1"
        run: |
          mkdir -p dist/release
          tar -C dist/binary -czf "dist/release/$ASSET" agents-pack
          test "$(tar -tzf "dist/release/$ASSET")" = agents-pack
          cd dist/release
          shasum -a 256 "$ASSET" > "$ASSET.sha256"

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: |
            dist/release/*.tar.gz
            dist/release/*.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Download release candidates
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: dist/release
          merge-multiple: true

      - name: Consolidate and verify checksums
        run: |
          cd dist/release
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 4
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 4
          cat ./*.sha256 | sort -k 2 > "agents-pack-${GITHUB_REF_NAME#cli-v}-checksums.txt"
          sha256sum -c "agents-pack-${GITHUB_REF_NAME#cli-v}-checksums.txt"

      - name: Create draft release and upload CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/release/*.tar.gz
          dist/release/*-checksums.txt
          --draft
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes-file CLI_RELEASE_NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  publish-registry:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Check shared registry release assets
        id: registry
        run: bun scripts/check-registry-ready.ts >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        if: steps.registry.outputs.ready == 'true'
        uses: actions/configure-pages@v6

      - name: Prepare registry and installer site
        if: steps.registry.outputs.ready == 'true'
        run: |
          mkdir -p dist/pages
          cp -R registry dist/pages/registry
          cp install.sh dist/pages/install.sh

      - name: Upload registry site
        if: steps.registry.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

      - name: Publish registry and installer
        if: steps.registry.outputs.ready == 'true'
        id: pages
        uses: actions/deploy-pages@v5
