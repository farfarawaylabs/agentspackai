name: Release core pack

on:
  push:
    tags:
      - "pack-core-v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-core-pack
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate repository
        run: bun run check

      - name: Build and validate official pack
        run: >-
          bun run pack:build
          --registry registry/v1/index.json
          --tag "$GITHUB_REF_NAME"

      - name: Create draft release and upload pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/packs/*.pack
          --draft
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes-file content/packs/core/RELEASE_NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  publish-registry:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare registry site
        run: |
          mkdir -p dist/pages/registry/v1
          cp registry/v1/index.json dist/pages/registry/v1/index.json

      - name: Upload registry site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

      - name: Publish registry
        id: pages
        uses: actions/deploy-pages@v4
